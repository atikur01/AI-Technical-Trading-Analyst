name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 20
  PUBLISH_DIR: publish
  WEBDEPLOY_SERVER: site102287.siteasp.net
  WEBDEPLOY_SITE: site102287

jobs:
  deploy:
    runs-on: windows-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Tailwind
        run: npm ci

      - name: Build CSS
        run: npx tailwindcss -i wwwroot/css/input.css -o wwwroot/css/site.css --minify

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: dotnet publish TradingChartAnalyzer.csproj -c Release -o ${{ env.PUBLISH_DIR }}

      - name: Verify CSS was published
        shell: pwsh
        run: |
          $css = Get-ChildItem -Path "$env:PUBLISH_DIR/wwwroot" -Recurse -Filter "site*.css" -ErrorAction SilentlyContinue
          if (-not $css) { throw "site.css is missing from the publish output." }

      - name: Write runtime secrets
        shell: pwsh
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          if (-not $env:AI_API_KEY) { throw "AI_API_KEY secret is not set." }
          if (-not $env:TWELVEDATA_API_KEY) { throw "TWELVEDATA_API_KEY secret is not set." }
          @(
            "Ai__ApiKey=$env:AI_API_KEY"
            "TwelveData__ApiKey=$env:TWELVEDATA_API_KEY"
          ) | Set-Content -Path "$env:PUBLISH_DIR/.env" -Encoding utf8NoBOM

      - name: Locate Web Deploy
        shell: pwsh
        run: |
          $msdeploy = @(
            "$env:ProgramFiles\IIS\Microsoft Web Deploy V3\msdeploy.exe"
            "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $msdeploy) { throw "msdeploy.exe was not found on the runner." }
          "MSDEPLOY=$msdeploy" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Deploy with Web Deploy
        shell: cmd
        env:
          WEBDEPLOY_USERNAME: ${{ secrets.WEBDEPLOY_USERNAME }}
          WEBDEPLOY_PASSWORD: ${{ secrets.WEBDEPLOY_PASSWORD }}
        run: >
          "%MSDEPLOY%"
          -verb:sync
          -source:contentPath="%GITHUB_WORKSPACE%\%PUBLISH_DIR%"
          -dest:contentPath="%WEBDEPLOY_SITE%",computerName="https://%WEBDEPLOY_SERVER%:8172/msdeploy.axd?site=%WEBDEPLOY_SITE%",userName="%WEBDEPLOY_USERNAME%",password="%WEBDEPLOY_PASSWORD%",authType="Basic"
          -allowUntrusted
          -enableRule:AppOffline
          -skip:objectName=dirPath,absolutePath=\\logs$
          -skip:skipAction=Delete,objectName=filePath,absolutePath=\\App_Data\\.*
